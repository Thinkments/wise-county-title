<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B842" />
      <stop offset="50%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>
    <linearGradient id="navy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#051329" />
    </linearGradient>
  </defs>
  
  <!-- Outer Circular Seal -->
  <circle cx="50" cy="50" r="48" fill="url(#navy-grad)" stroke="url(#gold-grad)" stroke-width="3" />
  <circle cx="50" cy="50" r="43" fill="none" stroke="url(#gold-grad)" stroke-width="1" stroke-dasharray="2,2" opacity="0.6" />
  
  <!-- Texas Star -->
  <path d="M50 16 L57 32 L74 33 L61 44 L65 61 L50 51 L35 61 L39 44 L26 33 L43 32 Z" fill="url(#gold-grad)" />
  
  <!-- Center Monogram WCTC -->
  <text x="50" y="74" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">WISE</text>
  <text x="50" y="86" font-family="sans-serif" font-size="7" font-weight="600" fill="#C59B27" text-anchor="middle" letter-spacing="2">EST. 1878</text>
</svg>
